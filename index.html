<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMMANDO - Military Base</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial;touch-action:none}
#hud{position:fixed;top:10px;left:10px;color:white;font-size:15px;z-index:10;background:rgba(0,0,0,0.65);padding:10px;border-radius:8px}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:white;font-size:28px;z-index:10;text-shadow:0 0 5px red;pointer-events:none}
#msg{position:fixed;top:30%;left:0;width:100%;text-align:center;color:yellow;font-size:32px;display:none;z-index:20;background:rgba(0,0,0,0.85);padding:20px}
button{padding:12px 25px;font-size:18px;background:#1e7e34;color:white;border:none;border-radius:8px}
#fire{position:fixed;bottom:25px;right:18px;width:85px;height:85px;background:#c0392b;color:white;border-radius:50%;font-size:16px;z-index:20;border:3px solid white}
#joyBase{position:fixed;bottom:25px;left:18px;width:120px;height:120px;background:rgba(255,255,255,0.2);border-radius:50%;z-index:20;border:2px solid white}
#joyKnob{position:absolute;top:35px;left:35px;width:50px;height:50px;background:white;border-radius:50%}
#joyText{position:absolute;top:5px;left:0;width:100%;text-align:center;color:white;font-size:12px}
</style>
</head>
<body>
<div id="hud">COMMANDO | MILITARY BASE<br>Enemies: <span id="left">6</span> | Health: <span id="hp">100</span><br>Base Clear Karo!</div>
<div id="cross">+</div>
<div id="msg"></div>
<div id="joyBase"><div id="joyText">MOVE</div><div id="joyKnob"></div></div>
<button id="fire">FIRE</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,30,140);
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,1.7,25);
let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

let light=new THREE.DirectionalLight(0xffffff,1); light.position.set(20,30,20); scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.55));

// === BARA AREA - 200 x 200 ===
let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshBasicMaterial({color:0x4a7c3a}));
ground.rotation.x=-Math.PI/2; scene.add(ground);
let road=new THREE.Mesh(new THREE.PlaneGeometry(8,200),new THREE.MeshBasicMaterial({color:0x555555}));
road.rotation.x=-Math.PI/2; road.position.y=0.01; scene.add(road);
let road2=new THREE.Mesh(new THREE.PlaneGeometry(200,8),new THREE.MeshBasicMaterial({color:0x555555}));
road2.rotation.x=-Math.PI/2; road2.position.y=0.01; scene.add(road2);

// === MILITARY BASE - Barracks / Rooms ===
function makeBarrack(x,z,color){
  let g=new THREE.Group();
  let walls=new THREE.Mesh(new THREE.BoxGeometry(16,6,10),new THREE.MeshBasicMaterial({color:color}));
  walls.position.y=3; g.add(walls);
  let roof=new THREE.Mesh(new THREE.BoxGeometry(17,1,11),new THREE.MeshBasicMaterial({color:0x333333}));
  roof.position.y=6.5; g.add(roof);
  // Door + Windows - Room jaisa lagega
  let door=new THREE.Mesh(new THREE.BoxGeometry(2,3.5,0.2),new THREE.MeshBasicMaterial({color:0x2b1d0e}));
  door.position.set(-3,1.75,5.05); g.add(door);
  for(let i=0;i<3;i++){
    let win=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,0.2),new THREE.MeshBasicMaterial({color:0x87ceeb}));
    win.position.set(2+i*3,3.5,5.05); g.add(win);
  }
  let sign=new THREE.Mesh(new THREE.BoxGeometry(4,1,0.2),new THREE.MeshBasicMaterial({color:0xffff00}));
  sign.position.set(0,5,5.05); g.add(sign);
  g.position.set(x,0,z); scene.add(g);
}
makeBarrack(-25,-25,0xd9c9a3);
makeBarrack(25,-25,0xc9b896);
makeBarrack(-25,0,0xb8a888);

// === Watch Tower ===
for(let x of [-15,15]){
  let leg1=new THREE.Mesh(new THREE.BoxGeometry(0.5,10,0.5),new THREE.MeshBasicMaterial({color:0x5b3a1a}));
  leg1.position.set(x,5,-35); scene.add(leg1);
  let leg2=leg1.clone(); leg2.position.x=x+2; scene.add(leg2);
  let cabin=new THREE.Mesh(new THREE.BoxGeometry(4,3,4),new THREE.MeshBasicMaterial({color:0x6b4a2a}));
  cabin.position.set(x+1,11,-35); scene.add(cabin);
  let tRoof=new THREE.Mesh(new THREE.BoxGeometry(5,0.5,5),new THREE.MeshBasicMaterial({color:0x8b0000}));
  tRoof.position.set(x+1,12.8,-35); scene.add(tRoof);
}

// === Bunker / Sand Bags ===
for(let i=0;i<5;i++){
  let bunker=new THREE.Mesh(new THREE.BoxGeometry(4,1.5,1),new THREE.MeshBasicMaterial({color:0x8a7a5a}));
  bunker.position.set(-20+i*9,0.75,-10); scene.add(bunker);
}

// === Flag + HeliPad + Tank ===
let pole=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,12),new THREE.MeshBasicMaterial({color:0xffffff}));
pole.position.set(0,6,-30
