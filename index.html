<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMANDO - Mission 1</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:Arial}
#hud{position:fixed;top:10px;left:10px;color:white;font-size:18px;z-index:10;background:rgba(0,0,0,0.5);padding:8px}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:red;font-size:32px;z-index:10}
#msg{position:fixed;top:35%;left:0;width:100%;text-align:center;color:yellow;font-size:36px;display:none;z-index:20;background:rgba(0,0,0,0.7);padding:20px}
button{padding:12px 25px;font-size:18px;background:green;color:white;border:none;cursor:pointer}
#fire{position:fixed;bottom:30px;right:20px;width:90px;height:90px;background:red;color:white;border-radius:50%;font-size:18px;z-index:15;border:3px solid white}
#joy{position:fixed;bottom:30px;left:20px;width:110px;height:110px;background:rgba(255,255,255,0.3);border-radius:50%;z-index:15;text-align:center;line-height:110px;color:white}
</style>
</head>
<body>
<div id="hud">COMMANDO | MISSION 1: CLEAR THE AREA<br>Enemies Left: <span id="left">5</span> | Health: <span id="hp">100</span></div>
<div id="cross">+</div>
<div id="msg"></div>
<div id="joy">MOVE</div>
<button id="fire">FIRE</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
let camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
camera.position.set(0,2,10);
let renderer=new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

let ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshBasicMaterial({color:0x3a7d44}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

for(let i=0;i<6;i++){
  let box=new THREE.Mesh(new THREE.BoxGeometry(3,2,1),new THREE.MeshBasicMaterial({color:0x8b8b8b}));
  box.position.set(-15+i*6,1,-5); scene.add(box);
}

let gun=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,1),new THREE.MeshBasicMaterial({color:0x111111}));
gun.position.set(0.3,-0.3,-0.8); camera.add(gun); scene.add(camera);

let enemies=[]; let left=5; let hp=100;
for(let i=0;i<5;i++){
  let e=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshBasicMaterial({color:0xff0000}));
  e.position.set(-12+i*6,1,-20-Math.random()*5); scene.add(e); enemies.push(e);
}

let keys={};
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let lastX=null;
document.addEventListener('touchmove',e=>{
  let x=e.touches[0].clientX;
  if(lastX!==null) camera.rotation.y -= (x-lastX)*0.005;
  lastX=x;
});

function shoot(){
  let ray=new THREE.Raycaster(); ray.setFromCamera({x:0,y:0},camera);
  let hits=ray.intersectObjects(enemies);
  if(hits.length>0){
    let dead=hits[0].object; scene.remove(dead);
    enemies=enemies.filter(e=>e!==dead);
    left--; document.getElementById('left').innerText=left;
    if(left===0){ document.getElementById('msg').style.display='block'; document.getElementById('msg').innerHTML='MISSION COMPLETE<br><br><button onclick="location.reload()">PLAY AGAIN</button>'; }
  }
}
document.getElementById('fire').addEventListener('click',shoot);
document.addEventListener('click',e=>{ if(e.target.id!=='fire') shoot(); });

let moving=false;
document.getElementById('joy').addEventListener('touchstart',()=>moving=true);
document.getElementById('joy').addEventListener('touchend',()=>moving=false);

function animate(){
  requestAnimationFrame(animate);
  if(keys['w']||moving) camera.position.z-=0.15;
  if(keys['s']) camera.position.z+=0.15;
  if(keys['a']) camera.position.x-=0.15;
  if(keys['d']) camera.position.x+=0.15;
  enemies.forEach(e=>{ e.position.z+=0.02; if(e.position.z>-1 && Math.random()<0.01){ hp-=2; document.getElementById('hp').innerText=hp; if(hp<=0){ document.getElementById('msg').style.display='block'; document.getElementById('msg').innerHTML='GAME OVER<br><br><button onclick="location.reload()">TRY AGAIN</button>'; } } });
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
