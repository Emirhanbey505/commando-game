let audioCtx=null, soundOn=true, master=null, reverb=null, noiseBuf=null;
function initAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    master=audioCtx.createGain(); master.gain.value=0.9;
    let comp=audioCtx.createDynamicsCompressor(); master.connect(comp); comp.connect(audioCtx.destination);
    let n=audioCtx.sampleRate*1.2, ir=audioCtx.createBuffer(2,n,audioCtx.sampleRate);
    for(let c=0;c<2;c++){ let d=ir.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.5); }
    reverb=audioCtx.createConvolver(); reverb.buffer=ir;
    let rg=audioCtx.createGain(); rg.gain.value=0.35; reverb.connect(rg); rg.connect(master);
    window.echo=audioCtx.createDelay(1); echo.delayTime.value=0.19; let fb=audioCtx.createGain(); fb.gain.value=0.32; let ef=audioCtx.createBiquadFilter(); ef.type='lowpass'; ef.frequency.value=1800; echo.connect(ef); ef.connect(fb); fb.connect(echo); let eo=audioCtx.createGain(); eo.gain.value=0.3; ef.connect(eo); eo.connect(master);
    noiseBuf=audioCtx.createBuffer(1,audioCtx.sampleRate,audioCtx.sampleRate);
    let nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    let ws=audioCtx.createBufferSource(); ws.buffer=noiseBuf; ws.loop=true; let wf=audioCtx.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=350; let wg=audioCtx.createGain(); wg.gain.value=0.04; ws.connect(wf); wf.connect(wg); wg.connect(master); ws.start();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function noise(t,dur,type,freq,vol,out){
  let s=audioCtx.createBufferSource(); s.buffer=noiseBuf;
  let f=audioCtx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
  let g=audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f); f.connect(g); g.connect(out); s.start(t,Math.random()*0.5,dur);
}
function thump(t,f0,f1,dur,vol,out){
  let o=audioCtx.createOscillator(); o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  let g=audioCtx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur);
}
/* rifle shot: crack + body + low thump + room echo + brass tick */
function playGun(dist){
  if(!soundOn) return; initAudio(); dist=dist||0;
  let t=audioCtx.currentTime, far=Math.min(dist/60,1);
  let bus=audioCtx.createGain(); bus.gain.value=(1-far*0.8)*(dist?0.7:1);
  let lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=dist?(9000-far*7500):12000;
  bus.connect(lp); lp.connect(master); lp.connect(reverb); lp.connect(echo);
  let v=0.9+Math.random()*0.2;
  noise(t,0.045,'highpass',2500*v,1.0,bus);            // sharp crack
  noise(t,0.14,'bandpass',1200*v,0.8,bus);             // body
  noise(t,0.30,'lowpass',500,0.9,bus);                 // boom
  thump(t,140*v,38,0.22,1.0,bus);                      // chest thump
  if(dist){ let d=audioCtx.createDelay(); d.delayTime.value=dist/343; }
  if(!dist) setTimeout(()=>{ if(soundOn&&audioCtx) noise(audioCtx.currentTime,0.03,'bandpass',4500,0.25,master); },260+Math.random()*80); // shell casing
}

  noise(t+1.1,0.04,'highpass',3000,0.6,master);        // bolt

}

  for(let i=-1;i<=1;i++) m(B(0.12,0.14,0.1),strap,torso,i*0.15,0.28,0.27);
  m(B(0.1,0.1,0.04),dark,torso,0.1,0.65,0.27);
  m(C(0.07,0.08,0.14),skin,torso,0,0.7,0);
  let head=new THREE.Group(); head.position.y=0.86; torso.add(head);
  let hd=m(new THREE.SphereGeometry(0.17,14,12),dark,head,0,0,0); hd.scale.set(0.9,1.05,1);
  m(B(0.2,0.045,0.03),skin,head,0,0.02,0.155);
  let hm=m(new THREE.SphereGeometry(0.21,14,10,0,Math.PI*2,0,Math.PI*0.5),camoHelm,head,0,0.03,0); hm.scale.set(1,0.9,1.1);
  m(B(0.45,0.03,0.4),camoHelm,head,0,0.05,0.02);
  function arm(s){ let ua=new THREE.Group(); ua.position.set(s*0.34,0.68,0); torso.add(ua);
    m(C(0.075,0.06,0.32),camoMat,ua,0,-0.16,0); m(new THREE.SphereGeometry(0.085),camoMat,ua,0,0,0);
    if(s<0) m(C(0.082,0.082,0.07),red,ua,0,-0.1,0);
    let fa=new THREE.Group(); fa.position.y=-0.32; ua.add(fa);
    m(C(0.06,0.05,0.3),camoMat,fa,0,-0.15,0); m(B(0.09,0.1,0.1),dark,fa,0,-0.33,0); return [ua,fa]; }
  let [uaL,faL]=arm(-1), [uaR,faR]=arm(1);
  let rifle=new THREE.Group(); rifle.position.set(0.1,0.5,0.4); torso.add(rifle);
  m(B(0.07,0.1,0.55),dark,rifle,0,0,0); let bar=m(C(0.018,0.018,0.4),dark,rifle,0,0.02,0.45); bar.rotation.x=Math.PI/2;
  m(B(0.05,0.18,0.07),dark,rifle,0,-0.13,0.05); m(B(0.06,0.12,0.22),strap,rifle,0,-0.02,-0.36);
  let fl=m(B(0.07,0.07,0.1),new THREE.MeshBasicMaterial({color:0xffcc44}),rifle,0,0.02,0.72); fl.visible=false;
  g.scale.setScalar(0.88); g.traverse(o=>{ if(o.isMesh) o.castShadow=true; });
  g.userData={hp:2,dead:false,fall:0,nextShot:1.5+Math.random()*2.5,spd:1.3+Math.random()*0.6,speedNow:0,phase:Math.random()*6,stepI:0,kick:0,flashT:0,flashM:fl,
    thL,shL,thR,shR,torso,head,uaL,faL,uaR,faR,rifle};
  g.position.set(x,0,z); scene.add(g); return g;
}
let enemies=[], left=6, hp=100, walkTime=0, over=false, ammo=30, reloading=false;
let lvl=1, cur=null;
const LV=n=>({count:Math.min(4+n,12),spd:1.1+n*0.12,hit:Math.min(0.2+n*0.045,0.6),rate:Math.max(2.7-n*0.18,1.0),hp:n<4?2:n<8?3:4,dmg:4+n*0.8});
function resolve(pos,r){ for(const b of cols){ if(pos.x>b.x0-r&&pos.x<b.x1+r&&pos.z>b.z0-r&&pos.z<b.z1+r){ let dl=pos.x-(b.x0-r),dr=(b.x1+r)-pos.x,dt_=pos.z-(b.z0-r),dd=(b.z1+r)-pos.z,m=Math.min(dl,dr,dt_,dd); if(m===dl) pos.x=b.x0-r; else if(m===dr) pos.x=b.x1+r; else if(m===dt_) pos.z=b.z0-r; else pos.z=b.z1+r; } } }
function spawn(c){ let x,z; for(let k=0;k<40;k++){ if(Math.random()<0.6){ x=-55+Math.random()*110; z=-45+Math.random()*9; } else { x=(Math.random()<0.5?-1:1)*(54+Math.random()*5); z=-32+Math.random()*34; } let ok=true; for(const b of cols) if(x>b.x0-1.2&&x<b.x1+1.2&&z>b.z0-1.2&&z<b.z1+1.2){ ok=false; break; } if(ok) break; }
  let e=makeSoldier(x,z); e.userData.hp=c.hp; e.userData.spd=c.spd*(0.9+Math.random()*0.2); return e; }
function startLevel(){ document.getElementById('msg').style.display='none'; enemies.forEach(e=>scene.remove(e)); enemies=[]; cur=LV(lvl); left=cur.count; for(let i=0;i<cur.count;i++) enemies.push(spawn(cur)); over=false; ammo=30; reloading=false; camera.position.set(0,1.7,28); hp=Math.min(100,hp+(lvl>1?35:0)); document.getElementById('hp').innerText=hp; document.getElementById('left').innerText=left; document.getElementById('lvl').innerText=lvl; setAmmo(); }
function levelDone(){ over=true; playWin(); let m=document.getElementById('msg'); m.style.display='block'; m.innerHTML=lvl>=10?'MISSION COMPLETE!<br>Sab 10 level jeet liye!<br><br><button onclick="location.reload()">PLAY AGAIN</button>':'LEVEL '+lvl+' CLEAR!<br><br><button onclick="lvl++;startLevel()">NEXT LEVEL '+(lvl+1)+'</button>'; }
function retry(){ hp=100; startLevel(); }
startLevel();

/* ================= CONTROLS ================= */
let yaw=0,pitch=0,lookTouchId=null,lastLookX=0,lastLookY=0,joyTouchId=null,joyX=0,joyY=0;
let joyBase=document.getElementById('joyBase'), joyKnob=document.getElementById('joyKnob');
function handleJoy(t){ let r=joyBase.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2; let dx=(t.clientX-cx)/40,dy=(t.clientY-cy)/40,len=Math.hypot(dx,dy); if(len>1){dx/=len;dy/=len;} joyX=dx; joyY=dy; joyKnob.style.left=(37+dx*25)+'px'; joyKnob.style.top=(37+dy*25)+'px'; }
function resetJoy(){ joyX=0; joyY=0; joyKnob.style.left='37px'; joyKnob.style.top='37px'; }
document.addEventListener('touchstart',function(e){ for(let t of e.changedTouches){ let el=document.elementFromPoint(t.clientX,t.clientY); if(el&&(el.id==='fire'||el.id==='soundBtn')) continue; if(el&&(joyBase.contains(el)||el===joyBase)){ joyTouchId=t.identifier; handleJoy(t); continue; } if(lookTouchId===null){ lookTouchId=t.identifier; lastLookX=t.clientX; lastLookY=t.clientY; } } },{passive:false});
document.addEventListener('touchmove',function(e){ for(let t of e.changedTouches){ if(t.identifier===joyTouchId){ handleJoy(t); e.preventDefault(); continue; } if(t.identifier===lookTouchId){ yaw-=(t.clientX-lastLookX)*0.005; pitch-=(t.clientY-lastLookY)*0.005; pitch=Math.max(-0.6,Math.min(0.6,pitch)); camera.rotation.y=yaw; camera.rotation.x=pitch; lastLookX=t.clientX; lastLookY=t.clientY; e.preventDefault(); } } },{passive:false});
document.addEventListener('touchend',function(e){ for(let t of e.changedTouches){ if(t.identifier===lookTouchId) lookTouchId=null; if(t.identifier===joyTouchId){ joyTouchId=null; resetJoy(); } } });
let keys={}; document.addEventListener('keydown',e=>{ keys[e.key.toLowerCase()]=true; if(e.code==='Space') shoot(); if(e.key==='r') reload(); }); document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ================= GAMEPLAY ================= */
const ray=new THREE.Raycaster(), flashEl=document.getElementById('flash');
function setAmmo(){ document.getElementById('ammo').innerText=reloading?'RELOAD...':ammo; }
function reload(){ if(reloading||ammo===30||over) return; reloading=true; setAmmo(); playReload(); setTimeout(()=>{ ammo=30; reloading=false; setAmmo(); },1500); }
function hurt(n){ hp=Math.max(0,hp-n); document.getElementById('hp').innerText=hp; playHurt(); flashEl.style.opacity=0.45; setTimeout(()=>flashEl.style.opacity=0,200); if(hp<=0&&!over){ over=true; playLose(); let m=document.getElementById('msg'); m.style.display='block'; m.innerHTML='GAME OVER<br><button onclick="retry()">TRY AGAIN</button>'; } }
let lastShot=0;
function shoot(){
  if(over||reloading) return; let now=performance.now(); if(now-lastShot<110) return; lastShot=now;
  if(ammo<=0){ reload(); return; }
  ammo--; setAmmo(); playGun(0);
  muzzleLight.intensity=3; setTimeout(()=>muzzleLight.intensity=0,50);
  gunGroup.position.z=-0.7; gunGroup.rotation.x=0.08; setTimeout(()=>{gunGroup.position.z=-0.8; gunGroup.rotation.x=0;},70);
  pitch+=0.01; camera.rotation.x=pitch; // recoil
  ray.setFromCamera({x:0,y:0},camera);
  let all=[]; enemies.forEach(e=>{ if(!e.userData.dead) e.traverse(c=>{ if(c.isMesh) all.push(c); }); });
  let hits=ray.intersectObjects(all);
  let cb=ray.intersectObjects(blk); if(cb.length&&(!hits.length||cb[0].distance<hits[0].distance)){ playRicochet(); hits.length=0; }
  if(hits.length){
    let p=hits[0].object; while(p.parent!==scene) p=p.parent;
    let head=hits[0].point.y>1.5; p.userData.hp-=head?2:1; playHit();
    if(p.userData.hp<=0){ p.userData.dead=true; playGrunt(); left--; document.getElementById('left').innerText=left; if(left===0&&!over) levelDone(); }
  }
  if(ammo===0) setTimeout(reload,300);
}
document.getElementById('fire').addEventListener('touchstart',function(e){ e.stopPropagation(); initAudio(); shoot(); });
document.getElementById('fire').addEventListener('click',function(){ initAudio(); shoot(); });
let clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate); let dt=Math.min(clock.getDelta(),0.05), t=performance.now()*0.004;
  if(!over){
    let dir=new THREE.Vector3(); camera.getWorldDirection(dir); dir.y=0; dir.normalize(); let right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0));
    let mx=joyX, mz=-joyY; if(keys['w']) mz+=1; if(keys['s']) mz-=1; if(keys['a']) mx-=1; if(keys['d']) mx+=1;
    if(mx||mz){ camera.position.addScaledVector(dir,mz*0.15); camera.position.addScaledVector(right,mx*0.15); walkTime+=0.3; stepCheck(); camera.position.y=1.7+Math.sin(walkTime)*0.05; }
    camera.position.x=Math.max(-60,Math.min(60,camera.position.x)); camera.position.z=Math.max(-45,Math.min(45,camera.position.z)); resolve(camera.position,0.5);
  }
  enemies.forEach((e,i)=>{
    let u=e.userData;
    if(u.dead){ if(u.fall<1.5){ u.fall+=dt*2.6; e.rotation.x=-Math.min(u.fall,1.45); e.position.y=Math.max(0,0.25-u.fall*0.15); u.uaL.rotation.x=u.uaR.rotation.x=0.6; u.thL.rotation.x=0.4; } else if(e.parent){ scene.remove(e); } return; }
    let dx=camera.position.x-e.position.x, dz=camera.position.z-e.position.z, dist=Math.hypot(dx,dz);
    let tg=Math.atan2(dx,dz), da=Math.atan2(Math.sin(tg-e.rotation.y),Math.cos(tg-e.rotation.y)); e.rotation.y+=da*Math.min(1,dt*4);
    u.losT=(u.losT||0)-dt; if(u.losT<=0){ u.losT=0.3; let o=new THREE.Vector3(e.position.x,1.4,e.position.z), d=new THREE.Vector3(camera.position.x-o.x,camera.position.y-o.y,camera.position.z-o.z), L2=d.length(); d.normalize(); losRay.set(o,d); losRay.far=L2; u.los=losRay.intersectObjects(blk).length===0; }
    let moving=(dist>14||!u.los)&&!over;
    u.speedNow+=((moving?u.spd:0)-u.speedNow)*Math.min(1,dt*3);
    if(u.speedNow>0.02){ let ox=e.position.x,oz=e.position.z; u.side=u.side||(Math.random()<0.5?-1:1); let sx=dx/dist,sz=dz/dist,bl=u.blocked>0?1.2:0; e.position.x+=(sx-sz*u.side*bl)*u.speedNow*dt; e.position.z+=(sz+sx*u.side*bl)*u.speedNow*dt; resolve(e.position,0.6); let mv=Math.hypot(e.position.x-ox,e.position.z-oz); if(mv<u.speedNow*dt*0.4){ u.blocked=1.2; if(Math.random()<0.02) u.side*=-1; } else u.blocked=Math.max(0,(u.blocked||0)-dt); }
    u.phase+=u.speedNow*dt*4.4; let p=u.phase, k=Math.min(1,u.speedNow/1.2);
    u.thL.rotation.x=Math.sin(p)*0.62*k; u.thR.rotation.x=-Math.sin(p)*0.62*k;
    u.shL.rotation.x=Math.max(0,Math.sin(p+1.3))*0.95*k+0.08; u.shR.rotation.x=Math.max(0,Math.sin(p+1.3+Math.PI))*0.95*k+0.08;
    u.kick=Math.max(0,u.kick-dt*7); let aim=moving?0.55:1;
    u.uaR.rotation.x=-(0.85+0.5*aim)-u.kick*0.12; u.faR.rotation.x=-(0.5+0.5*aim); u.uaR.rotation.z=-0.1;
    u.uaL.rotation.x=-(1.0+0.45*aim)-u.kick*0.1; u.faL.rotation.x=-(0.75+0.35*aim); u.uaL.rotation.z=0.3;
    u.torso.rotation.x=0.06+0.05*k-u.kick*0.1; u.torso.rotation.y=Math.sin(p)*0.1*k; u.torso.scale.y=1+Math.sin(t*0.9+i)*0.012;
    u.head.rotation.y=moving?0:Math.sin(t*0.5+i)*0.25; u.rifle.position.z=0.4-u.kick*0.07;
    e.position.y=Math.abs(Math.cos(p))*0.05*k;
    u.flashT-=dt; u.flashM.visible=u.flashT>0;
    let si=Math.floor(p/Math.PI); if(si!==u.stepI){ u.stepI=si; if(k>0.5) playStep(dist); }
    if(!moving&&!over){ u.nextShot-=dt; if(u.nextShot<=0){ u.nextShot=cur.rate*(0.6+Math.random()*0.8); u.kick=1; u.flashT=0.06; playGun(dist); if(Math.random()<cur.hit) setTimeout(()=>{ if(!over) hurt(Math.round(cur.dmg*(0.7+Math.random()*0.6))); },80); else setTimeout(playBullet,60); } }
  });
  renderer.render(scene,camera);
}
animate();
function checkOrientation(){ document.getElementById('rotateMsg').style.display=(window.innerHeight>window.innerWidth)?'flex':'none'; camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }
window.addEventListener('resize',checkOrientation);
window.addEventListener('orientationchange',function(){ setTimeout(checkOrientation,300); });
checkOrientation();
